<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hexes Studio — Projects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
input,textarea,button{font:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.proj-row:hover{border-color:var(--line-hover);background:var(--panel2)}
.hx-root{--bg:#121418;--backdrop:#0C0D10;--panel:#1A1D22;--panel2:#20242A;--line-soft:#262A31;--line:#2C313A;--line-strong:#3A404B;--line-hover:#4A515D;--text:#ECEAE4;--text-2:#C9CDD3;--muted:#A3A9B3;--placeholder:#7D838D;--accent:#F2B13C;--accent-hover:#FFD07A;--on-accent:#1A1405;--accent-bg:#362A12;--ready:#8EC1FF;--ready-bg:#1C2A3D;--verified:#6FD3C0;--verified-bg:#143330;--blocked:#FF9A7A;--blocked-bg:#3A1F18;--success:#6FD3A8;--danger-line:#5A2A24;color-scheme:dark;transition:background-color .2s,color .2s}
.hx-root.light{--bg:#F6F5F2;--backdrop:#E4E2DD;--panel:#FFFFFF;--panel2:#F0EEEA;--line-soft:#ECEAE5;--line:#E0DDD7;--line-strong:#CFCBC4;--line-hover:#B5B0A8;--text:#1B1D21;--text-2:#3D424A;--muted:#5F656E;--placeholder:#8A8F97;--accent:#96620A;--accent-hover:#7A4F06;--on-accent:#FFFFFF;--accent-bg:#FBEFD6;--ready:#1F5FB8;--ready-bg:#E3EEFC;--verified:#0F7363;--verified-bg:#DDF3EE;--blocked:#B23A17;--blocked-bg:#FBE5DD;--success:#1E7A4F;--danger-line:#E8B4A8;color-scheme:light}
</style>
</helmet>
<div class="hx-root {{themeClass}}" style="min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 32px; border-bottom: 1px solid var(--line); flex-wrap: wrap">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2 L24.4 8 L24.4 20 L14 26 L3.6 20 L3.6 8 Z" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"></path><path d="M14 9 L18.3 11.5 L18.3 16.5 L14 19 L9.7 16.5 L9.7 11.5 Z" fill="var(--accent)"></path></svg>
      <span style="font-weight: 700; font-size: 18px; letter-spacing: -0.01em">Hexes Studio</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" title="{{themeLabel}}" style="width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--text-2); cursor: pointer">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
      </button>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted)">~/code/hexes/.hx/data.json</span>
    </div>
  </header>

  <main style="flex: 1; width: 100%; max-width: 960px; margin: 0 auto; padding: 56px 32px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 32px; letter-spacing: -0.02em; font-weight: 700">Projects</h1>
        <p style="margin: 0; font-size: 15px; color: var(--muted)">No project selected yet. Pick one to make it your <code style="font-family: 'JetBrains Mono', monospace; color: var(--text)">studio.selected_project</code>.</p>
      </div>
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        New project
      </a>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <label for="proj-filter" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filter projects</label>
      <input id="proj-filter" type="search" placeholder="Filter by title or hex id" style="flex: 1; min-width: 0; background: transparent; border: none; color: var(--text); font-size: 15px; outline: none">
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{projects}}" as="p" hint-placeholder-count="3">
        <li>
          <a class="proj-row" href="Project.dc.html" style="display: flex; align-items: center; gap: 20px; padding: 20px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--text); text-decoration: none; flex-wrap: wrap">
            <svg width="40" height="40" viewBox="0 0 28 28" aria-hidden="true" style="flex: none"><path d="M14 2 L24.4 8 L24.4 20 L14 26 L3.6 20 L3.6 8 Z" fill="var(--panel2)" stroke="var(--line-strong)" stroke-width="1.5" stroke-linejoin="round"></path><text x="14" y="17.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="var(--accent)">{{p.initial}}</text></svg>
            <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 18px; font-weight: 600">{{p.title}}</span>
              <span style="font-size: 14px; color: var(--muted); line-height: 1.5">{{p.blurb}}</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-2)">{{p.id}}</span>
              <span style="font-size: 13px; color: var(--muted)">{{p.counts}}</span>
            </div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </a>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  themeVals() {
    var self = this;
    var t = this.state && this.state.theme;
    if (!t) { try { t = window.localStorage.getItem('hexes-theme'); } catch (e) {} }
    if (!t) { t = this.props.theme || 'dark'; }
    var light = t === 'light';
    return {
      themeClass: light ? 'light' : '',
      isLight: light,
      isDark: !light,
      themeLabel: light ? 'Switch to dark mode' : 'Switch to light mode',
      toggleTheme: function () {
        var next = light ? 'dark' : 'light';
        try { window.localStorage.setItem('hexes-theme', next); } catch (e) {}
        self.setState({ theme: next });
      }
    };
  }
  renderVals() {
    return Object.assign(this.baseVals(), this.themeVals());
  }
  baseVals() {
    return {
      projects: [
        { initial: 'HS', title: 'Hexes Studio', id: 'hx-studio-a1f', blurb: 'A UI and MCP server for tracking projects as atomic hexes.', counts: '3 epics · 14 stories' },
        { initial: 'DS', title: 'Docs site', id: 'hx-docs-5e2', blurb: 'Public documentation for the hex data model and conventions.', counts: '1 epic · 4 stories' },
        { initial: 'IM', title: 'Markdown importer', id: 'hx-import-0c9', blurb: 'Convert existing PRDs and issue lists into hexes.', counts: '2 epics · 7 stories' }
      ]
    };
  }
}
</script>
</body>
</html>
